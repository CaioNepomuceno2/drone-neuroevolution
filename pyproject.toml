[project]
name = "drone-evo"
version = "0.1.0"
description = "Drones que aprendem sozinhos a inspecionar uma linha de transmissão: rede neural + algoritmo genético escritos do zero em NumPy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[project.scripts]
drone-train = "drone_evo.train:main"
drone-play = "drone_evo.play:main"
drone-best = "drone_evo.select_best:main"
drone-video = "drone_evo.make_video:main"
drone-gif = "drone_evo.make_gif:main"
drone-report = "drone_evo.report:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
